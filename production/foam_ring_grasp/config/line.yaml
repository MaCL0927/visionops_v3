# Foam ring production configuration
# Current scope at M39.5.0 validation:
#   - real ring_mouth visible: frozen FLAT + TILTED production grasp
#   - no mouth or side-view pseudo mouth: M39.4.0.1 side-axis recovery
#   - reliable side axis: M39.4.1 camera-facing arc + opening reconstruction
#   - M39.4.2.2 shortens side PREGRASP and simplifies robot motion to PREGRASP→GRASP, then direct AVOIDANCE return
#   - side path uses branch-specific INITIAL + collision-avoidance waypoint
#   - grasp direction for visible-mouth production: 3 o'clock only
#   - M39.5.1 routes clearly tilted visible-mouth rings to SIDE_INITIAL,
#     targets the camera-nearest opening-wall midpoint, and enables the robot
#     branch only after full M39.4.2 collision/clearance validation.
# Historical stage-tuning configs stay outside production.
schema_version: '7.2'
task: foam_ring_grasp_m39_5_2_30deg_hybrid_ready_routing
classes:
  foam_ring: foam_ring
  ring_mouth: ring_mouth
inference:
  confidence: 0.2
  iou: 0.5
  image_size: 640
  max_detections: 300
  retina_masks: true
  device: auto
association:
  use_filled_outer_envelope: true
  envelope_close_px: 3
  envelope_dilate_px: 4
  minimum_component_area_ratio: 0.03
  minimum_envelope_containment: 0.55
  minimum_center_inside: true
  maximum_normalized_center_distance: 0.55
  minimum_mouth_to_ring_area_ratio: 0.025
  maximum_mouth_to_ring_area_ratio: 0.7
  fallback_bbox_enabled: true
  fallback_bbox_expand_px: 10
  fallback_minimum_containment: 0.3
  fallback_maximum_normalized_center_distance: 0.7
  fallback_score_penalty: 0.3
depth:
  minimum_mm: 150
  maximum_mm: 3000
  mask_erode_px: 2
  mouth_exclusion_px: 2
  front_band_expand_ratio: 0.4
  minimum_front_band_px: 6
  maximum_front_band_px: 26
  minimum_valid_points: 80
  local_obstacle_margin_mm: 8.0
  maximum_front_obstacle_ratio: 0.18
  local_obstacle_observable_max_tilt_deg: 25.0
plane:
  ransac_iterations: 420
  inlier_threshold_mm: 5.0
  minimum_inlier_ratio: 0.34
  random_seed: 3401
  refine_with_svd: true
pose:
