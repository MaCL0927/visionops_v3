    contact_block: 2.0
    palm: 2.0
    pneumatic_fitting: 2.0
    mounting_disk: -6.0
  include_robot_wrist_in_tool_collision: false
  pregrasp_to_grasp_samples: 9
  stop_on_first_hard_reject: true

production_target_retry:
