schema_version: "6.4"
task: foam_ring_rim_pinch_m38_6_direction_collision_contact_fix

classes:
  foam_ring: foam_ring
  ring_mouth: ring_mouth

inference:
  confidence: 0.20
  iou: 0.50
  image_size: 640
  max_detections: 300
  retina_masks: true
  device: auto

association:
  # Reuse the robust lesson from the first M34 experiments: PT/RKNN can split
  # one physical ring into several visible components. Pair the mouth against a
  # filled envelope instead of requiring raw-mask overlap.
  use_filled_outer_envelope: true
  envelope_close_px: 3
  envelope_dilate_px: 4
  minimum_component_area_ratio: 0.03
  minimum_envelope_containment: 0.55
  minimum_center_inside: true
  maximum_normalized_center_distance: 0.55
  minimum_mouth_to_ring_area_ratio: 0.025
  maximum_mouth_to_ring_area_ratio: 0.70

  fallback_bbox_enabled: true
  fallback_bbox_expand_px: 10
  fallback_minimum_containment: 0.30
  fallback_maximum_normalized_center_distance: 0.70
  fallback_score_penalty: 0.30

depth:
  minimum_mm: 150
  maximum_mm: 3000
  mask_erode_px: 2
  mouth_exclusion_px: 2
  front_band_expand_ratio: 0.40
  minimum_front_band_px: 6
  maximum_front_band_px: 26
  minimum_valid_points: 80

  # Local depth check for each clock position. It is only a stage-1 warning;
  # M34_new does not claim complete gripper/body collision safety.
  local_obstacle_margin_mm: 8.0
  maximum_front_obstacle_ratio: 0.18
  local_obstacle_observable_max_tilt_deg: 25.0

plane:
  ransac_iterations: 420
  inlier_threshold_mm: 5.0
  minimum_inlier_ratio: 0.34
  random_seed: 3401
  refine_with_svd: true

pose:
  # The foam rim is rounded. Use the mouth ellipse to stabilize the ring axis
  # when the largest RANSAC plane is a tangent patch or side wall.
  normal_mode: auto
  trust_depth_plane_min_inlier_ratio: 0.82
  trust_depth_plane_max_residual_p95_mm: 4.0
  trust_depth_plane_max_disagreement_deg: 12.0
  ellipse_azimuth_ambiguous_below_deg: 8.0

  # When both cues say the mouth is nearly frontal, a low-tilt depth plane is
  # more stable than the fitted ellipse azimuth. This avoids visibly skewed
  # axes on almost circular mouths.
  near_frontal_depth_override_enabled: true
  near_frontal_max_ellipse_tilt_deg: 28.0
  near_frontal_max_depth_tilt_deg: 20.0
  near_frontal_min_depth_inlier_ratio: 0.25
  near_frontal_max_depth_residual_p95_mm: 8.0

  boundary_inner_ratio: 0.95
  boundary_outer_ratio: 1.35
  minimum_boundary_support_points: 40
  stabilized_inlier_threshold_mm: 8.0
  depth_direction_tiebreak_weight: 0.15
  normal_disagreement_warning_deg: 20.0

  # M37.6.1 stop-loss: a large ellipse/depth-plane disagreement no longer
  # forces M36 to choose one unreliable cue.  The pair is marked uncertain and
  # handed to M37.6 with its matched mouth retained as a soft constraint.
  pose_conflict_policy: fallback_to_m37
  # Deprecated compatibility switch used only when pose_conflict_policy is
  # absent. Keep false in the production configuration.
  pose_conflict_hard_reject_enabled: false
  maximum_normal_disagreement_deg: 25.0
  conditional_normal_disagreement_deg: 18.0
  conditional_minimum_depth_plane_inlier_ratio: 0.55
  maximum_stabilized_residual_p95_mm: 8.0

object_geometry:
  # New measured foam-ring dimensions. The local RGB-D estimate remains the
  # primary value; these nominal values are used for plausibility checks.
  nominal_inner_diameter_mm: 60.0
  nominal_outer_diameter_mm: 85.0
  nominal_wall_thickness_mm: 14.0
  axial_length_mm: 70.0
  minimum_inner_diameter_mm: 50.0
  maximum_inner_diameter_mm: 70.0
  minimum_wall_thickness_mm: 10.0
  maximum_wall_thickness_mm: 17.0
  maximum_outer_search_radius_ratio: 1.35
  maximum_ring_mask_gap_px: 2
  physical_size_hard_reject: false

gripper:
  # One finger enters the mouth and the other remains outside. The gripper then
  # closes and pinches one local section of the foam wall.
  mode: rim_pinch

  # M34 local finger sweep now follows the newest measured moving-finger
  # envelope: 16 mm in the closing direction and 20 mm laterally.
  finger_thickness_mm: 16.0
  finger_width_mm: 20.0

  # Measured distance between the two inward-facing finger surfaces.
  opening_reference: inner_gap
  minimum_opening_mm: 10.0
  maximum_opening_mm: 75.0
  # Closing near the mechanical minimum is allowed for a soft foam wall.
  # The desired gap is clamped to the usable mechanical range, then the actual
  # compression is checked. Keep the approach opening farther from the limit.
  closing_limit_margin_mm: 0.5
  approach_limit_margin_mm: 3.0

  # Desired compression per side and the acceptable actual range after the
  # command gap is clamped to the gripper's physical opening range.
  wall_compression_mm: 1.5
  minimum_contact_compression_mm: 0.5
  maximum_contact_compression_mm: 3.0

  # The fingers straddle the wall while open, descend below the front rim, then
  # close. 15-25 mm is a practical tuning range; start at 20 mm.
  rim_insert_depth_mm: 20.0
  pregrasp_offset_mm: 90.0
  preopen_clearance_mm: 6.0

  # Twelve fixed clock positions: 12, 1, ..., 11 o'clock.
  clock_position_count: 12
  clock_zero: image_up
  clock_direction: clockwise

  geometry_candidate_max_tilt_deg: 45.0
  robot_safe_max_tilt_deg: 30.0
  top_layer_tolerance_mm: 15.0

# M35.1 measured complete end-effector geometry. The local origin used by the
# model is the midpoint between the two fingertips at the final inserted pose;
# +X is closing, +Y is lateral, and +Z points toward the object. Upstream parts
# therefore have negative local Z.
gripper_geometry_3d:
  frame_origin: fingertip_midpoint_at_final_inserted_pose
  opening_reference: inner_contact_surface_gap

  contact_block:
    width_x_mm: 15.0
    thickness_y_mm: 20.0
    length_z_mm: 35.0
    intended_ring_engagement_mm: 20.0

  moving_finger:
    pivot_to_tip_mm: 90.0
    width_x_mm: 16.0
    thickness_y_mm: 20.0

  finger_kinematics:
    mode: symmetric_pivot_arc
    pivot_center_separation_mm: 36.0
    pivot_center_from_disk_lower_mm: 55.0
    measured_minimum_gap_mm: 10.0
    measured_maximum_gap_mm: 75.0

  palm:
    length_z_mm: 60.0
    width_x_mm: 50.0
    thickness_y_mm: 35.0

  mounting_disk:
    diameter_mm: 70.0
    length_z_mm: 20.0
    disk_lower_to_tip_nominal_mm: 145.0
    disk_upper_to_tip_nominal_mm: 165.0

  pneumatic_fitting:
    enabled: true
    axis: positive_x
    center_from_disk_lower_mm: 25.0
    protrusion_length_mm: 30.0
    diameter_mm: 10.0
    count: 2
    center_spacing_y_mm: 20.0

  robot_wrist:
    enabled: true
    diameter_mm: 100.0
    length_z_mm: 200.0

# M35.1-compatible final closed-pose check. M35.2 retains this fast final
# validation and adds the complete motion from pregrasp until the wall is pinched.
full_gripper_static_collision:
  enabled: true
  static_final_pose_only: true

  obb_surface_resolution: 4
  cylinder_radial_samples: 24
  cylinder_axial_samples: 5
  front_entry_tolerance_mm: 2.0

  # Extra modelling/measurement margin added on top of the calibrated box
  # model's wall-specific margins. The wrist is approximate, so it is largest.
  component_extra_margin_mm:
    contact_block: 2.0
    moving_finger: 4.0
    palm: 6.0
    mounting_disk: 8.0
    pneumatic_fitting: 8.0
    robot_wrist: 10.0

  minimum_points_per_instance: 12
  minimum_collision_points: 4
  intersection_tolerance_mm: 1.5
  minimum_clearance_mm: 4.0

  hard_reject_box_intersection: true
  hard_reject_box_clearance: false
  hard_reject_neighbor_intersection: true
  hard_reject_neighbor_clearance: true
  hard_reject_neighbor_unknown: false
  hard_reject_on_unconfigured: true

  include_instance_checks_in_json: false
  include_component_details_in_json: false
  score_weight: 0.20
  score_saturation_mm: 40.0

# M35.2 checks the complete end effector only until the target wall has been
# pinched. Post-grasp lift/transport is intentionally omitted: the next grasp
# cycle will acquire a new RGB-D frame and re-plan from the changed scene.
full_gripper_motion_collision:
  enabled: false
  motion_scope: pregrasp_to_grasp_only
  check_post_grasp_lift: false

  # Start at the configured pregrasp point with a small opening, open near the
  # target, approach the rim while open, insert, then close on the foam wall.
  travel_opening_mm: 10.5
  open_start_offset_mm: 25.0

  travel_sample_count: 7
  open_sample_count: 6
  approach_sample_count: 7
  insert_sample_count: 5
  close_sample_count: 7

  # Dynamic checks reuse the measured geometry, component margins and depth
  # collision thresholds from full_gripper_static_collision unless overridden.
  obb_surface_resolution: 3
  cylinder_radial_samples: 16
  cylinder_axial_samples: 4
  front_entry_tolerance_mm: 2.0
  minimum_points_per_instance: 12
  minimum_collision_points: 4
  intersection_tolerance_mm: 1.5
  minimum_clearance_mm: 4.0

  hard_reject_box_intersection: true
  hard_reject_box_clearance: false
  hard_reject_neighbor_intersection: true
  hard_reject_neighbor_clearance: true
  hard_reject_neighbor_unknown: false
  hard_reject_on_unconfigured: true

  # Skip expensive path sampling when an earlier local/static hard condition has
  # already rejected the clock point. Stop at the first confirmed path hazard.
  skip_if_prerequisite_failed: true
  stop_on_first_hard_reject: true

  include_pose_details_in_json: false
  include_pose_component_details_in_json: false
  score_weight: 0.20
  score_saturation_mm: 40.0

box_wall:
  # M34_new.4 uses a calibrated 3-D cuboid in camera optical coordinates.
  # The front opening is not a wall; side/top/bottom/rear planes become active
  # only after a swept finger volume enters the box-local Z >= 0 region.
  enabled: true
  model: calibrated_3d_cuboid
  calibration_file: box_model.json
  # M38.6 rejects confirmed intersections, while a missing/mismatched model is
  # still reported separately by the existing configuration policy.
  hard_reject: false
  hard_reject_intersection: true

  # Reject use of a stale model when ROI resolution or camera intrinsics change.
  resolution_tolerance_px: 0
  intrinsics_relative_tolerance: 0.02

  # Sample finger cross-section corners along approach, insertion and closing.
  sweep_sample_count: 18
  front_entry_tolerance_mm: 2.0

  # Clearance participates in clock-position scoring after hard collision checks.
  score_saturation_mm: 35.0

  # Legacy 2-D polygon mode is intentionally disabled. Recalibrate the 3-D
  # model if the camera, ROI, or box fixture moves.
  fallback_2d_enabled: false

neighbor_3d:
  # Use the aligned depth points of all other foam_ring instances instead of
  # treating 2-D mask overlap as a physical collision.
  enabled: true
  minimum_depth_mm: 150
  maximum_depth_mm: 3000

  # Build visible per-instance point clouds. Excluding each matched ring_mouth
  # prevents the background seen through a hole from becoming a fake obstacle.
  mask_erode_px: 1
  neighbor_mouth_exclusion_px: 1
  point_stride: 2
  minimum_points_per_instance: 12
  minimum_total_points: 20
  maximum_points_per_instance: 3000

  # PT masks can overlap. If a neighbor-mask point agrees with the current
  # target front-pose plane, regard it as duplicated target surface, not a
  # separate obstacle.
  target_surface_exclusion_enabled: true
  target_surface_exclusion_dilate_px: 2
  target_surface_exclusion_mm: 12.0

  # Reject only when a small cluster, rather than one flying depth point,
  # enters the finger volume. The K-th nearest point is also used for robust
  # clearance.
  minimum_collision_points: 4
  intersection_tolerance_mm: 1.5
  minimum_clearance_mm: 3.0
  hard_reject_on_intersection: true
  hard_reject_on_clearance: true
  hard_reject_on_unknown: false

  score_saturation_mm: 30.0
  unknown_score: 0.35

  # Full stage-by-instance checks are kept under _debug and stripped from the
  # normal JSON. Set true only for detailed diagnosis because files grow fast.
  include_instance_checks_in_json: false

candidate:
  # Local cross-section checks. These do not replace the next-stage full 3D
  # swept-volume collision test of the fingers, palm and wrist.
  minimum_inner_finger_mouth_containment: 0.65
  # M34_new.4 keeps these 2-D metrics only for warnings/scoring diagnostics.
  # The neighbor_3d section performs the hard collision decision.
  maximum_other_ring_overlap_ratio: 0.10
  neighbor_2d_overlap_mode: warning_only
  minimum_image_border_margin_px: 3
  minimum_neighbor_clearance_mm: 2.0
  neighbor_2d_clearance_mode: warning_only
  hard_reject_front_obstacle: false

  score_weights:
    box_wall_clearance: 0.22
    inner_containment: 0.18
    neighbor_clearance: 0.16
    opening_margin: 0.14
    local_depth_clearance: 0.10
    lower_tilt: 0.10
    segmentation_confidence: 0.06
    image_border: 0.04

# M36.4.2 online geometry acceleration. The online default now ranks matched
# ring/mouth pairs cheaply, analyzes them one by one, and returns immediately
# after the first target obtains one complete collision-checked grasp. M36.4.1
# staged and the historical exhaustive modes remain available for A/B diagnosis.
geometry_optimization:
  enabled: true
  mode: first_valid            # first_valid | staged | exhaustive
  timing_enabled: true

  skip_rejected_pairs: true
  prefer_top_layer: true
  round_robin_pairs: true       # used by staged mode
  cache_neighbor_point_clouds: true

  # first_valid mode: normally only the highest-ranked pair is fully analyzed.
  # If it fails geometry/collision checks, try the next pair, up to this limit.
  stop_after_first_valid_target: true
  stop_after_first_valid_candidate: true
  # M38.6 can override this per branch. A value greater than one means that a
  # first valid clock direction is not accepted immediately; several top-ranked
  # directions are fully collision-checked and the best valid one is selected.
  minimum_full_candidates_before_accept: 1
  maximum_pairs_to_fully_analyze: 3
  maximum_full_candidates_per_pair: 12

  # M36.4.1 staged-mode compatibility settings.
  initial_full_candidate_budget: 4
  maximum_full_candidate_budget: 8
  minimum_valid_full_candidates: 2
  expand_if_no_valid: true

# Low-cost target ordering performed before RANSAC or point-cloud generation.
# Sparse front-rim depth prioritizes the nearest/top-layer target, then pairing
# quality and segmentation confidence break ties.
pair_preselection:
  enabled: true
  depth_sample_stride: 4
  ring_erode_px: 1
  mouth_exclusion_px: 2

# Adaptive direction search over the original 12 integer clock positions.
# The eight primary positions are checked first. Only if none yields a complete
# valid grasp are the remaining 1/4/7/10 o'clock positions added.
clock_search:
  mode: adaptive_8_plus_4
  primary_clock_hours: [12, 2, 3, 5, 6, 8, 9, 11]
  fallback_to_remaining: true

quality:
  minimum_depth_valid_ratio: 0.32
  minimum_ellipse_points: 12
  minimum_mouth_area_px: 80
  minimum_ring_area_px: 300

robot_interface:
  # Optical-frame convention normally used by the aligned color image:
  # +X right, +Y down, +Z forward.
  camera_frame_id: camera_color_optical_frame
  length_unit: mm
  orientation_format: axes_rotation_matrix_quaternion

  # Visual grasp frame:
  #   +X: closing axis, from the inner finger/contact toward the outer one.
  #   +Z: approach axis, from pregrasp toward the ring.
  #   +Y: Z cross X, completing a right-handed frame.
  closing_axis_name: x
  approach_axis_name: z

online_rgbd:
  # M36.3 caches exact RGB/D2C-depth pairs before Runtime inference returns.
  # The Runtime capture_timestamp_ms must match this cache exactly; never use
  # the latest or nearest depth frame as a silent fallback.
  enabled: true
  shared_rgb_name: /visionops_orbbec336l_rgb
  shared_depth_name: /visionops_orbbec336l_depth

  # 12 frames retain roughly 400 ms at 30 FPS. One 1280x720 RGB-D pair is
  # about 4.6 MB, so the default cache is approximately 55 MB.
  cache_frames: 12
  max_age_ms: 2000
  poll_interval_ms: 1.0
  exact_match_timeout_ms: 500

  # Keep RGB for M36.4 overlay and one-shot diagnostic capture. Set false only
  # when memory is constrained and no exact-frame overlay is required.
  cache_rgb: true

  # Safety contract. M36.3 rejects configurations that weaken either value.
  require_exact_timestamp: true
  allow_nearest_fallback: false

online_service:
  # M36.5 persistent trigger service. It keeps RGB-D cache/config/calibration
  # resident and serializes explicit request_id jobs through one geometry worker.
  enabled: true
  listen_host: 0.0.0.0
  listen_port: 19213

  # Explicit robot/manual triggers are reliable jobs, not latest-only frames.
  # Duplicate request_id returns the existing job/result without re-running.
  trigger_queue_capacity: 4
  geometry_queue_capacity: 4
  request_registry_capacity: 64
  default_wait_timeout_ms: 15000
  maximum_wait_timeout_ms: 60000

  # Production triggers do not write RGB/depth/JSON files unless save_debug=true.
  default_save_debug: false
  output_root: data/foam_ring_online_geometry

  # Keep only one in-memory JPEG from the latest trigger for /snapshot.jpg.
  latest_overlay_enabled: true
  overlay_jpeg_quality: 90

  # Runtime health/status is cached briefly; every inference still carries the
  # exact Runtime capture timestamp used for RGB-D matching.
  runtime_status_ttl_ms: 1000
  max_http_body_bytes: 1048576

online_geometry:
  # M36.4 one-shot diagnostic pipeline. This stage invokes the existing
  # analyze_scene() only after a Runtime capture timestamp has matched an exact
  # RGB-D cache entry. It never enables robot output.
  enabled: true
  runtime_url: http://127.0.0.1:28081
  runtime_timeout_s: 8.0
  cache_ready_timeout_s: 3.0

  # Geometry accepts only real coeff×proto masks. bbox_fallback is suitable for
  # Web preview only and must not silently select depth pixels.
  # Existing box_model.json and M35 geometry were calibrated in Runtime input
  # ROI coordinates (528x455). Crop exact RGB-D to that ROI and shift cx/cy.
  coordinate_space: runtime_input_roi
  require_proto_mask: true
  reject_bbox_fallback: true
  minimum_mask_area_px: 20

  # Keep Raw Local HTTP as the preferred localhost transport.
  raw_http_enabled: true
  raw_http_fallback_urllib: true
  max_response_bytes: 67108864

  # M36.4 is one-shot diagnostics, so saving exact inputs is intentional.
  # Continuous M36.5 processing must not write these files every frame.
  save_exact_rgb_png: true
  save_exact_depth_png: true
  save_depth_colormap: true
  save_runtime_result: true
  save_overlay: true

# M38.1 branch A: when a ring mouth is clearly visible, fit the directly
# observed 3-D foam annulus around that mouth. The annulus plane normal is used
# as the ring axis; the 2-D ellipse only localizes/measures the opening.
# Legacy M36/M37.6 code remains retained but is disabled by M38.4 production policy.
m38_branch_a:
  enabled: true
  fallback_to_m36: false

  # M38.6 direction selection. Keep lazy target ordering, but fully evaluate
  # the top three clock directions for the selected ring before accepting a
  # result. If those three all fail, continue until the first valid direction
  # or the per-pair cap is reached.
  compare_top_clock_candidates: 3
  maximum_full_clock_candidates: 6

  # Clear-opening gate. BBox-fallback associations and extremely flat or
  # irregular mouth masks are not trusted by branch A.
  require_strict_association: true
  minimum_mouth_containment: 0.65
  minimum_mouth_to_ring_area_ratio: 0.04
  maximum_mouth_to_ring_area_ratio: 0.58
  minimum_mouth_minor_major_ratio: 0.35
  maximum_ellipse_normalized_residual_p90: 0.38

  # Build a narrow 3-D annulus from target foam only. Depth-jump pixels and
  # overlapping neighboring-ring masks are removed before plane fitting.
  ring_mask_erode_px: 2
  annulus_outer_expand_ratio: 0.55
  minimum_annulus_outer_expand_px: 7
  maximum_annulus_outer_expand_px: 32
  mouth_inner_exclusion_px: 2
  exclude_other_ring_masks: true
  neighbor_exclusion_dilate_px: 1
  depth_edge_threshold_mm: 22.0
  depth_edge_dilate_px: 1
  point_sample_stride: 1

  # A real front annulus must be observable around a sufficiently wide angular
  # span and must support one compact 3-D plane. Failure proceeds to M38.3 and
  # then to the explicit M38.4 branch-C decision.
  angular_sector_count: 16
  minimum_angular_coverage_deg: 180.0
  minimum_inlier_angular_coverage_deg: 160.0
  minimum_valid_points: 80
  minimum_depth_valid_ratio: 0.30
  minimum_plane_inlier_ratio: 0.45
  maximum_plane_residual_p95_mm: 7.0

# M38.3 branch B: segmented or depth-inferred partial opening plus constrained side-cylinder.
# The local outer side patch behind that end is fitted to the known outer
# radius.  Nominal complete inner/outer opening projections are created only
# after the side-cylinder and partial-end checks pass, then the existing
# inner/outer rim-pinch and full collision pipeline remains authoritative. A ring with
# only an outer side surface and no opening/end evidence is never accepted.
m38_branch_b:
  enabled: true
  fallback_to_m36: false
  maximum_candidates_per_trigger: 4

  # M38.3 opening evidence. A segmented mouth enters branch B only when it is
  # genuinely off-centre. Unmatched rings may instead provide a deep connected
  # aperture component surrounded by near-surface rim pixels.
  allowed_association_modes: [strict_envelope, bbox_fallback]
  minimum_mouth_containment: 0.28
  minimum_mouth_to_ring_area_ratio: 0.012
  maximum_mouth_to_ring_area_ratio: 0.50
  minimum_partial_opening_center_offset_ratio: 0.10
  inferred_opening_ring_erode_px: 1
  inferred_opening_minimum_depth_gap_mm: 35.0
  inferred_opening_minimum_area_ratio: 0.04
  inferred_opening_maximum_area_ratio: 0.36
  inferred_opening_minimum_center_offset_ratio: 0.12
  inferred_opening_maximum_center_offset_ratio: 0.68
  inferred_opening_maximum_boundary_contact_ratio: 0.40
  inferred_opening_minimum_inside_distance_px: 5.0
  inferred_opening_rim_dilate_px: 5
  inferred_opening_minimum_rim_support_px: 16

  # Extract the observed outer-cylinder side patch behind the aperture. The
  # depth band is anchored by the near side-surface mode rather than by the full
  # ring percentile, which otherwise mixes the deep hole/background component.
  ring_mask_erode_px: 2
  mouth_exclusion_dilate_px: 3
  neighbor_exclusion_dilate_px: 1
  minimum_side_band_inset_px: 4.0
  minimum_side_band_inset_ratio: 0.08
  maximum_side_band_inset_ratio: 0.60
  side_depth_front_tolerance_mm: 18.0
  side_depth_back_tolerance_mm: 38.0
  rim_support_depth_back_tolerance_mm: 50.0
  depth_edge_threshold_mm: 18.0
  depth_edge_dilate_px: 1
  surface_component_minimum_ratio: 0.08
  normal_neighbor_step_px: 2
  minimum_side_points: 80
  minimum_normal_points: 40
  maximum_fit_points: 500
  maximum_normal_fit_points: 400

  # Projection-constrained fixed-radius cylinder. The image projection of the
  # axis must point from the ring body toward the observed aperture; only its
  # camera-facing component is sampled. This replaces the free 3-D axis sweep
  # that selected an orthogonal minimum in M38.2.
  constrained_view_component_deg: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
  fixed_radius_iterations: 4
  radial_inlier_threshold_mm: 6.0
  minimum_radial_inlier_ratio: 0.60
  maximum_radial_residual_median_mm: 5.0
  maximum_radial_residual_p90_mm: 16.0
  maximum_normal_axis_median_deg: 22.0
  maximum_normal_axis_p90_deg: 48.0
  maximum_normal_radial_median_deg: 32.0
  maximum_projected_axis_error_deg: 8.0
  minimum_observed_side_span_mm: 18.0

  # Branch B is used for half-side/side poses. A camera-facing opening component
  # is still mandatory because the mechanism can only perform inner/outer rim
  # pinch. A purely side-only surface remains rejected.
  minimum_axis_view_angle_deg: 35.0
  maximum_axis_view_angle_deg: 89.5

  # Measured rim anchor and projected opening support. Coverage is normalized by
  # the projected nominal opening, not by the often larger/deformed deep aperture
  # component. The old camera-near endpoint margin is retained only as diagnosis.
  rim_support_dilate_px: 5
  minimum_rim_support_points: 16
  opening_rim_axial_percentile: 90.0
  rim_anchor_inlier_threshold_mm: 10.0
  minimum_rim_anchor_inliers: 10
  maximum_rim_anchor_residual_p90_mm: 10.0
  opening_overlap_dilate_px: 2
  minimum_synthetic_opening_coverage: 0.45
  synthetic_mouth_sample_count: 96
  minimum_synthetic_mouth_area_px: 50
  minimum_synthetic_outer_area_px: 100
  maximum_opening_center_error_px: 20.0
  maximum_opening_center_error_radius_ratio: 0.80

  # M38.5 stop-loss: a depth-inferred aperture with little direct observed
  # opening support must not enter the expensive 12-clock inner/outer gripper
  # evaluator. It is handed to the pure-side outer-contact branch instead.
  full_geometry_minimum_observed_opening_coverage: 0.15
  full_geometry_side_on_angle_deg: 80.0
  full_geometry_side_on_minimum_observed_opening_coverage: 0.25

  # Branch-B geometry may exceed the old M36 tilt limit, but all existing box,
  # neighbor, finger-body, insertion and motion collision checks remain active.
  maximum_candidate_tilt_deg: 90.0
  robot_safe_max_tilt_deg: 82.0

# M38.5 branch D: pure-side outer contact geometry. This branch uses only the
# observed outer cylindrical surface. It does not infer ring_mouth, does not
# create an inner-finger point and does not run the 12-clock complete-gripper
# collision evaluator. The output is camera-frame geometry and is not robot-ready.
m38_branch_d:
  enabled: true
  only_without_mouth: true
  # Keep this diagnostic-only branch focused on scenes where the segmentation
  # model found no opening at all. Mixed scenes stay with M38.1/M38.3/C.
  require_no_mouth_instances_in_scene: true
  stop_after_first_eligible: true
  maximum_candidates_per_trigger: 3

  ring_mask_erode_px: 2
  neighbor_exclusion_dilate_px: 1
  side_depth_front_tolerance_mm: 16.0
  side_depth_back_tolerance_mm: 48.0
  depth_edge_threshold_mm: 18.0
  depth_edge_dilate_px: 1
  surface_component_minimum_ratio: 0.10
  normal_neighbor_step_px: 2
  minimum_side_points: 100
  minimum_normal_points: 50
  maximum_fit_points: 500
  maximum_normal_fit_points: 400
  central_axis_fraction: 0.70

  # The normal covariance gives the undirected cylinder-axis seed. Only a small
  # local two-angle refinement is searched around that seed.
  local_axis_offsets_deg: [-12, -8, -4, 0, 4, 8, 12]
  fixed_radius_iterations: 4
  radial_inlier_threshold_mm: 7.0

  minimum_radial_inlier_ratio: 0.65
  maximum_radial_residual_median_mm: 5.0
  maximum_radial_residual_p90_mm: 12.0
  maximum_normal_axis_median_deg: 24.0
  maximum_normal_axis_p90_deg: 52.0
  maximum_normal_radial_median_deg: 35.0
  minimum_visible_normal_span_deg: 60.0
  minimum_observed_axis_span_mm: 25.0
  minimum_axis_view_angle_deg: 65.0
  maximum_normal_axis_eigenvalue_ratio: 0.55
  bootstrap_group_count: 4
  maximum_bootstrap_axis_dispersion_deg: 18.0

  contact_support_axial_half_span_mm: 12.0
  maximum_contact_support_error_mm: 14.0
  minimum_contact_inside_mask_px: 2.0

  # M38.6 contact placement: robustly recover both observed axial endpoints,
  # choose the endpoint whose centreline is closer to the camera, then move
  # 15% inward from that end before selecting the camera-near outer arc.
  contact_axial_lower_percentile: 8.0
  contact_axial_upper_percentile: 92.0
  contact_from_camera_near_end_fraction: 0.15

# M38.4 branch C: after M38.1, M38.3 and M38.5 exhaust usable geometry,
# explicitly reject the trigger instead of asking M36/M37.6 to infer a hidden
# opening from a nearly pure side surface. This is required by the current
# gripper, which supports inner/outer rim pinch only.
m38_branch_c:
  enabled: true
  fast_terminate: true
  fallback_to_m36: false
  fallback_to_m37_6: false
  operator_action: turn_or_agitate_box

hybrid_grasp:
  # M38.5 evidence-first trigger policy. Depth records remain available for
  # diagnostics and optional legacy comparison, but production does not run M36/M37.6.
  enabled: true
  prefer_mouth_visible: true
  # M38.4 temporarily disables the legacy branches while retaining their code.
  legacy_m36_enabled: false
  side_ring_fallback_enabled: false
  side_ring_only_unmatched: true
  # M37.6 keeps a mouth-matched ring eligible after M36 rejects it. The mouth
  # becomes an optional annular-face constraint for the unified hollow model.
  multi_surface_include_m36_rejected: true
  stop_after_first_side_eligible: true
  maximum_side_ring_attempts: 0

  depth_layering:
    enabled: true
    # Rings whose robust front-surface depths differ by no more than this value
    # remain grouped for diagnostics and optional legacy comparison. M38.1 and
    # M38.3 scan all evidence-backed openings globally.
    layer_tolerance_mm: 30.0
    surface_percentile: 25.0
    mask_erode_px: 3
    mouth_exclusion_dilate_px: 2
    sample_stride: 2
    minimum_valid_points: 20
    minimum_valid_ratio: 0.08
    minimum_depth_mm: 150.0
    maximum_depth_mm: 3000.0

  bounded_refinement:
    # M37.6.1 disables online local_accurate. Saved RGB-D bundles can still be
    # replayed offline, but a robot trigger must not spend another ~13 seconds
    # trying to rescue an uncertain axis.
    fast_first_enabled: true
    maximum_accurate_refinements_per_trigger: 0

  # M37.5.1: rank all same-layer rings with cheap 2-D/depth evidence, then run
  # cylinder screening only on the best few. Full ambiguity/bootstrap checks are
  # delayed until one preliminary pose-safe candidate is found.
  lightweight_preselection:
    enabled: true
    maximum_candidates_per_layer: 3
    mask_erode_px: 2
    sample_stride: 3
    neighbor_contact_dilate_px: 2
    depth_iqr_reference_mm: 40.0
    depth_edge_threshold_mm: 20.0
    minimum_valid_points: 30
    minimum_valid_ratio: 0.20
    delayed_final_validation_enabled: true


axis_direction:
  # M35.4 diagnostic master switch. When false, skip fixed-length 3-D rod
  # endpoint calculation, 2-D projection, overlay drawing and diagnostic JSON.
  # The core pose normal remains enabled because grasp geometry depends on it.
  enabled: false

  # Total physical length of the centered 3-D rod before projection. Keeping
  # this fixed makes the 2-D projected length reflect the ring tilt.
  rod_length_mm: 80.0
  minimum_projected_rod_px: 1.0

  # Near end: solid red arrow/filled endpoint. Far end: cyan dashed line/open endpoint.
  mask_alpha: 0.18
  line_thickness: 3
  far_dash_length_px: 9.0
  far_gap_length_px: 6.0
  endpoint_radius_px: 7
  draw_vector_values: true
  draw_depth_values: true

output:
  pointcloud_stride: 4
  local_pointcloud_stride: 1
  save_scene_pointcloud: true
  save_local_pointclouds: true
  save_depth_colormap: true
  save_overlay: true
  save_paired_axis_overlay: true
  save_robot_candidate: true

# M37 independent offline branch for side-lying rings whose opening is not
# reliably segmented as ring_mouth. The object is fitted as a known-size short
# hollow cylinder. This branch does not replace the M36 mouth-visible workflow.
side_ring_template:
  enabled: true

  # Defaults are inherited from object_geometry when omitted.
  outer_radius_mm: 42.5
  inner_radius_mm: 30.0
  axial_length_mm: 70.0

  # Use interior mask depth so legacy polygon stair steps and D2C edge mixing do
  # not dominate the 3-D fit.
  mask_erode_px: 2
  minimum_depth_mm: 150.0
  maximum_depth_mm: 3000.0
  depth_lower_quantile: 0.01
  depth_upper_quantile: 0.99
  maximum_depth_behind_median_mm: 80.0

  # Standalone/offline execution policy retained for M37.2 compatibility.
  # The M37.4 online hybrid path ignores confidence-first ordering and performs
  # depth-layer-first fast search at scene level.
  execution_mode: first_valid_confidence  # first_valid_confidence | exhaustive
  stop_after_first_eligible: true
  maximum_instances_to_attempt: 0  # 0 = unlimited until first success
  first_valid_search_profile: auto  # fast first, accurate fallback when needed
  exhaustive_search_profile: accurate

  # Restrict depth extraction to the instance bbox.  This avoids scanning the
  # complete ROI for every ring while preserving original image coordinates.
  point_extraction_bbox_padding_px: 3
  minimum_depth_points: 80

  # Accurate search retained from M37.1 for fallback and exhaustive comparison.
  maximum_fit_points: 1200
  global_axis_samples: 320
  local_refine_angles_deg: [12.0, 4.0, 1.5]
  local_refine_radial_steps: 3
  local_refine_azimuth_steps: 16
  fixed_radius_iterations: 12

  # M37.2 coarse-to-fine fast profile.  The real instance-7 frame keeps the
  # corrected grasp point while reducing axis fitting from about 608 ms to
  # about 120-135 ms on the local validation machine.
  fast_search_enabled: true
  fast_maximum_fit_points: 700
  # The global stage uses fewer points than local refinement. The coarse winner
  # is re-evaluated on fast_maximum_fit_points before angular refinement.
  fast_global_maximum_fit_points: 400
  fast_global_axis_samples: 80
  fast_local_refine_angles_deg: [12.0, 4.0, 1.5]
  fast_local_refine_radial_steps: 2
  fast_local_refine_azimuth_steps: 12
  fast_fixed_radius_iterations: 6

  # Fit score is a quality/ranking signal only. It no longer vetoes a pose that
  # has passed final safety validation. The field remains for quality tiers and
  # offline compatibility.
  fast_accept_max_score: 3.0

  # M37.5.1 preliminary screen: one retained hypothesis, two small local levels,
  # no Top-K ambiguity or bootstrap. This is the per-candidate online path.
  screen_maximum_fit_points: 320
  screen_normal_maximum_points: 320
  screen_axis_hypothesis_count: 8
  screen_top_k_hypotheses: 1
  screen_local_refine_angles_deg: [5.0, 1.5]
  screen_local_refine_radial_steps: 1
  screen_local_refine_azimuth_steps: 8
  screen_fixed_radius_iterations: 4

  # Delayed final validation starts from the screen axis. It performs a bounded
  # local refinement and then executes P90, ambiguity and bootstrap checks.
  final_validation_maximum_fit_points: 900
  final_validation_normal_maximum_points: 700
  final_validation_top_k_hypotheses: 2
  final_validation_refine_angles_deg: [2.0, 0.75]
  final_validation_refine_radial_steps: 2
  final_validation_refine_azimuth_steps: 12
  final_validation_fixed_radius_iterations: 8
  final_validation_bootstrap_trials: 3

  # One bounded warm-start local accurate refinement. It starts from the best
  # fast axis and therefore does not repeat the 320-direction global search.
  local_accurate_maximum_fit_points: 1200
  local_accurate_refine_angles_deg: [4.0, 1.5, 0.5]
  local_accurate_refine_radial_steps: 3
  local_accurate_refine_azimuth_steps: 16
  local_accurate_fixed_radius_iterations: 12

  # Kept only for standalone/offline search_profile=auto compatibility.
  accurate_fallback_enabled: true
  accurate_fallback_on_quality_gate_failure: true
  random_seed: 3701

  # M37.5 surface separation and normal-constrained axis fitting.  Other ring
  # masks and D2C depth jumps are removed before deprojection.  The axis is
  # generated from surface-normal hypotheses instead of relying only on a
  # fixed-radius radial residual.
  # M37.6 unified hollow short-cylinder model. Scene points are assigned to
  # outer wall, inner wall, near annular face or far annular face.
  multi_surface_enabled: true
  multi_surface_side_normal_max_deg: 38.0
  multi_surface_face_normal_max_deg: 32.0
  multi_surface_domain_penalty_weight: 0.45
  multi_surface_normal_penalty_weight: 0.035
  multi_surface_inlier_threshold_mm: 7.0
  multi_surface_minimum_outer_points: 35
  multi_surface_minimum_inner_points: 8
  multi_surface_minimum_face_points: 12
  multi_surface_minimum_surface_types: 1
  multi_surface_mouth_annulus_dilate_px: 8
  multi_surface_mouth_annulus_inner_px: 1
  multi_surface_mouth_axis_weight: 0.08
  multi_surface_mouth_center_weight: 0.03
  multi_surface_center_iterations: 8
  # M37.6.1 diagnostic-only depth gradient. The shallow/deep centroid vector
  # is retained in results for analysis, but it does not steer axis ranking and
  # cannot reject a geometrically good candidate online.
  multi_surface_depth_gradient_weight: 0.0
  multi_surface_depth_gradient_hard_reject_enabled: false
  multi_surface_depth_gradient_min_delta_mm: 12.0
  multi_surface_depth_gradient_min_centroid_separation_mm: 15.0
  multi_surface_minimum_inlier_ratio: 0.50
  multi_surface_maximum_residual_median_mm: 6.5
  multi_surface_maximum_residual_p90_mm: 14.0
  multi_surface_maximum_depth_gradient_axis_error_deg: 18.0
  multi_surface_maximum_mouth_axis_error_deg: 25.0

  normal_constrained_enabled: true
  neighbor_exclusion_dilate_px: 3
  depth_edge_threshold_mm: 14.0
  depth_edge_dilate_px: 1
  surface_component_minimum_ratio: 0.08
  normal_neighbor_step_px: 2
  minimum_normal_points: 80
  minimum_normal_valid_ratio: 0.08

  normal_axis_hypothesis_count: 24
  normal_pair_hypothesis_samples: 160
  normal_fallback_global_samples: 24
  normal_top_k_hypotheses: 3
  normal_hypothesis_dedup_deg: 6.0

  # The score combines radial fit with two physically necessary constraints:
  # side-surface normals are perpendicular to the cylinder axis and aligned
  # with the fitted radial direction.
  normal_score_axis_weight: 0.10
  normal_score_radial_weight: 0.06
  normal_axis_inlier_deg: 22.0
  normal_radial_inlier_deg: 35.0
  minimum_normal_inlier_ratio: 0.50
  maximum_normal_axis_median_deg: 12.0
  maximum_normal_axis_p90_deg: 28.0
  maximum_normal_radial_median_deg: 22.0
  maximum_normal_radial_p90_deg: 48.0
  minimum_visible_normal_span_deg: 28.0

  # Pose uncertainty rejection.  Keep multiple distinct hypotheses and reject
  # a result when two distant axes have nearly equal support or bootstrap
  # resampling does not reproduce the selected direction.
  ambiguity_min_axis_separation_deg: 12.0
  ambiguity_min_score_margin: 0.18
  bootstrap_trials: 5
  bootstrap_sample_ratio: 0.65
  maximum_bootstrap_axis_spread_deg: 12.0
  maximum_normal_seed_disagreement_deg: 18.0
  reject_when_normal_evidence_insufficient: true

  # Fit-quality gates for the nominal outer cylindrical surface.
  radial_inlier_threshold_mm: 6.0
  minimum_radial_inlier_ratio: 0.65
  maximum_radial_residual_median_mm: 4.0
  maximum_radial_residual_p90_mm: 16.0
  minimum_observed_axis_span_mm: 35.0
  maximum_observed_axis_span_mm: 105.0

  # A mouth-facing ring has its axis close to the camera view direction. M37 is
  # intended for side-lying rings, so require a sufficiently transverse axis.
  minimum_side_lay_angle_deg: 45.0
  endpoint_quantile_low: 0.05
  endpoint_quantile_high: 0.95

  # Resolve the axis sign exactly as requested for M37: the selected opening is
  # the endpoint closer to the depth-camera origin, and the directed axis points
  # from the far endpoint toward this near endpoint.
  near_endpoint_metric: euclidean_camera_distance

  # M37.1 grasp-point definition.  The old M37 near-opening projected top point
  # is retained only as a diagnostic marker.  The physical point is placed on
  # the camera-visible outer cylindrical crown, inset from the near opening.
  top_arc_sample_count: 720
  grasp_radius_mode: outer_surface  # outer_surface | wall_midline | inner_surface
  grasp_axial_inset_mm: 11.0

  # Use radial inlier points from this near-side axial band to recover the
  # actually visible cylindrical arc.  The largest circular gap defines the
  # occluded side; 1% trimming suppresses isolated depth/mask outliers.
  visible_crown_enabled: true
  visible_crown_axial_band_start_mm: 5.0
  visible_crown_axial_band_end_mm: 22.0
  visible_crown_minimum_points: 80
  visible_crown_angular_trim_quantile: 0.01

  # 0 is the image-higher endpoint of the visible angular interval, 1 is the
  # image-lower endpoint.  0.44 matches the requested upper-arc center on the
  # real instance-7 validation frame while remaining configurable for later
  # batch calibration.
  visible_crown_upper_fraction: 0.44
  visible_crown_minimum_span_deg: 35.0
  visible_crown_maximum_span_deg: 175.0
  visible_crown_fallback_mode: camera_facing
